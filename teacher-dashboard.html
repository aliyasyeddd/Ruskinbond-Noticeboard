<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Dashboard — Ruskin Bond Class 5</title>
  <link rel="stylesheet" href="css/style.css">
<body>

  <!-- ===== MENU: what does the teacher want to do? ===== -->
  <div id="teacherMenu" class="screen active">
    <div class="screen-stack">
      <div class="topbar"><span class="title">Class 5 · Ruskin Bond</span></div>
      <div class="card">
        <div class="badge" id="teacherBadge">Loading...</div>
        <h1>What would you like to do?</h1>
        <button class="role-row" onclick="showTeacherScreen('teacherPostScreen')">
          <span class="emoji">
            <svg viewBox="0 0 40 40" fill="none" stroke="#EE6C5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="9" y="6" width="18" height="24" rx="2"/>
              <line x1="13" y1="13" x2="23" y2="13"/>
              <line x1="13" y1="19" x2="23" y2="19"/>
              <line x1="13" y1="25" x2="19" y2="25"/>
              <g transform="translate(20,20) rotate(45)">
                <rect x="0" y="0" width="14" height="5" rx="1.5" fill="#FBEAE6" stroke="#EE6C5B"/>
                <polygon points="14,0 19,2.5 14,5" fill="#EE6C5B" stroke="none"/>
              </g>
            </svg>
          </span>
          <span>
            <div class="label">Post something</div>
            <div class="sub">Homework, announcement, holiday, event</div>
          </span>
        </button>
        <button class="role-row" onclick="showTeacherScreen('teacherFeedScreen')">
          <span class="emoji">
            <svg viewBox="0 0 40 40" fill="none" stroke="#EE6C5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="8" y="8" width="24" height="26" rx="3"/>
              <rect x="15" y="5" width="10" height="6" rx="2" fill="#FBEAE6"/>
              <line x1="13" y1="18" x2="27" y2="18"/>
              <line x1="13" y1="23" x2="27" y2="23"/>
              <line x1="13" y1="28" x2="21" y2="28"/>
            </svg>
          </span>
          <span>
            <div class="label">View Feed</div>
            <div class="sub">See what all teachers have posted</div>
          </span>
        </button>
        <button class="role-row" onclick="showTeacherScreen('submissionsScreen')">
          <span class="emoji">
            <svg viewBox="0 0 40 40" fill="none" stroke="#EE6C5B" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="11" width="28" height="20" rx="3"/>
              <path d="M6,13 L20,25 L34,13"/>
            </svg>
          </span>
          <span>
            <div class="label">Leave Letters & Activities</div>
            <div class="sub">What students have submitted</div>
          </span>
        </button>
        <button class="signout" onclick="window.location.href='index.html'">Sign out</button>
      </div>
    </div>
  </div>

  <!-- ===== POST screen ===== -->
  <div id="teacherPostScreen" class="screen">
    <button class="back-fixed" onclick="showTeacherScreen('teacherMenu')">← Back</button>
    <div class="screen-stack">
      <div class="card-title">Post something</div>
      <div class="card">
        <label>Type</label>
        <select id="postType" onchange="toggleHomeworkSubject()">
          <option value="" disabled selected>Select a type...</option>
          <option value="homework">Homework</option>
          <option value="announcement">Exam Announcement</option>
          <option value="holiday">Holiday</option>
          <option value="event">Event</option>
        </select>
        <!-- Subject picker: only shown when the type is Homework -->
        <div id="homeworkSubjectWrap" style="display:none;">
          <label>Subject</label>
          <select id="postSubject">
            <option value="TEL">Telugu</option>
            <option value="HIN">Hindi</option>
            <option value="ENG">English</option>
            <option value="MAT">Maths</option>
            <option value="EVS">EVS</option>
            <option value="COM">Computer</option>
          </select>
        </div>
        <label>Message</label>
        <textarea id="postContent" placeholder="Details for students..."></textarea>
        <label>Attach file (optional)</label>
        <div style="display:flex; gap:8px;">
          <label style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--cream); border:1.5px solid #F0E4DC; border-radius:12px; padding:12px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
            Choose File
            <input type="file" id="postFileChoose" accept="image/*,.pdf,.doc,.docx,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" style="display:none;" onchange="handleTeacherFile(this)">
          </label>
          <label style="flex:1; display:flex; align-items:center; justify-content:center; gap:6px; background:var(--cream); border:1.5px solid #F0E4DC; border-radius:12px; padding:12px; font-size:13px; font-weight:700; color:var(--ink); cursor:pointer;">
            <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Take Photo
            <input type="file" id="postFileCamera" accept="image/*" capture="environment" style="display:none;" onchange="handleTeacherFile(this)">
          </label>
        </div>
        <div id="teacherFileName" style="font-size:12px; color:var(--muted); margin-top:6px; text-align:left;"></div>
        <div id="postErr" style="font-size:12px; color:#C0392B; margin-top:8px; text-align:left;"></div>
        <button class="primary" onclick="createPost()">Post</button>
      </div>
    </div>
  </div>

  <!-- ===== FEED screen: posts from ALL teachers in the class ===== -->
  <div id="teacherFeedScreen" class="screen">
    <button class="back-fixed" onclick="showTeacherScreen('teacherMenu')">← Back</button>
    <div class="screen-stack">
      <div class="card-title">Class Feed</div>
      <div class="card">
        <!-- Filter chips: "My posts" shows only this teacher's own subject -->
        <div class="filters" id="teacherFilters">
          <button class="on" data-type="all" onclick="setTeacherFilter('all')">All</button>
          <button data-type="homework" onclick="setTeacherFilter('homework')">Homework</button>
          <button data-type="announcement" onclick="setTeacherFilter('announcement')">Exams</button>
          <button data-type="holiday" onclick="setTeacherFilter('holiday')">Holidays</button>
          <button data-type="event" onclick="setTeacherFilter('event')">Events</button>
          <button data-type="mine" onclick="setTeacherFilter('mine')">My posts</button>
        </div>
        <!-- Color key for homework subjects -->
        <div class="subj-legend" id="teacherLegend"></div>
        <div id="teacherFeed" class="empty-state">Loading...</div>
      </div>
    </div>
  </div>

  <!-- ===== SUBMISSIONS screen: leave letters + DAK activities ===== -->
  <div id="submissionsScreen" class="screen">
    <button class="back-fixed" onclick="showTeacherScreen('teacherMenu')">← Back</button>
    <div class="screen-stack">
      <div class="card-title">Leave Letters & Activities</div>
      <div class="card">
        <div class="section-title" style="margin-top:0; display:flex; align-items:center; gap:6px;">
          <svg viewBox="0 0 40 40" width="16" height="16" fill="none" stroke="#EE6C5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10,30 L26,14 L31,19 L15,35 L8,37 Z"/><line x1="23" y1="17" x2="28" y2="22"/></svg>
          Leave Letters
        </div>
        <div id="leaveLettersList" class="empty-state">Loading...</div>

        <div class="section-title" style="display:flex; align-items:center; gap:6px;">
          <svg viewBox="0 0 40 40" width="16" height="16" fill="none" stroke="#EE6C5B" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20,8 C10,8 6,15 6,21 C6,27 11,28 14,26 C16,24.5 18,26 17,28 C16,30 18,32 21,32 C30,32 34,25 34,19 C34,12 28,8 20,8 Z"/><circle cx="14" cy="17" r="1.8" fill="#EE6C5B" stroke="none"/><circle cx="21" cy="14" r="1.8" fill="#EE6C5B" stroke="none"/><circle cx="27" cy="18" r="1.8" fill="#EE6C5B" stroke="none"/></svg>
          DAK Activities
        </div>
        <div id="dakActivitiesList" class="empty-state">Loading...</div>
      </div>
    </div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/db.js"></script>
<script src="js/teacher.js"></script>

</body>
</html>
